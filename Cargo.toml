[package]
name = "nowhear"
version = "0.4.1"
edition = "2024"
rust-version = "1.88.0"
authors = ["Akiomi Kamakura <akiomik@gmail.com>"]
description = "Cross-platform media playback information watcher"
repository = "https://github.com/akiomik/nowhear"
readme = "README.md"
license = "Apache-2.0"
keywords = ["media", "music", "playback", "mpris", "now-playing"]
categories = ["multimedia", "os"]
include = [
  "examples",
  "src",
  "CHANGELOG.md",
  "LICENSE",
  "README.md",
]

[features]
tracing = ["dep:tracing"]
serde = ["dep:serde"]

[dependencies]
base64 = "0.22"
futures = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
tracing = { version = "0.1", optional = true }
tokio = { version = "1", features = ["macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "stream"
path = "examples/stream.rs"

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

multiple_crate_versions = "allow"
unwrap_used = "warn"
panic = "warn"
absolute_paths = "warn"
