name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds the package the way `cargo publish` would, which runs the build
  # scripts and proc macros of every dependency. The job therefore gets no
  # OIDC token and hands nothing to the publish job.
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Check package
        run: cargo publish --dry-run --locked

  # Packs the same commit again and uploads it without compiling. Any step
  # in this job can request the OIDC token, so it runs only actions/checkout,
  # rust-lang's own tools and the runner image: no dependency code and no
  # other actions.
  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth

      - name: Publish to crates.io
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
